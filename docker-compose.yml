services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-terreno_cnr}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terreno_cnr_pg_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-terreno_cnr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-terreno_cnr_pg_2026}@postgres:5432/${DB_NAME:-terreno_cnr}?schema=public
      JWT_SECRET: ${JWT_SECRET:-terreno_cnr_jwt_enterprise_secret_2026_32chars}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-terreno_cnr_aes256_gcm_key_2026_32chars}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      STORAGE_DRIVER: disk
      STORAGE_DIR: /app/storage
      ENCRYPT_EVIDENCES: ${ENCRYPT_EVIDENCES:-true}
      AUTO_SEED: ${AUTO_SEED:-true}
      STT_API_URL: ${STT_API_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api

volumes:
  postgres_data:
  api_storage:
